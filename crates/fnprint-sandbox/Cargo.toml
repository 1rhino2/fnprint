[package]
name = "fnprint-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "seccomp + rlimit process jail for fnprint's untrusted worker"
repository.workspace = true

[dependencies]
anyhow = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"
rustix = { version = "0.38", features = ["process", "thread"] }
libc = "0.2"

# the jail self-test (tests/jail.rs) drives the jailbreak_probe bin and checks
# the kill signal, so it needs the SIGSYS constant.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

# the library itself is unsafe-free, but the jailbreak_probe test binary must
# issue raw mmap/mprotect to prove the PROT_EXEC deny, and there is no safe-Rust
# way to request an executable page. so this crate is `deny` (not the workspace
# `forbid`) with one scoped `#[allow]` in the probe, same pattern as fnprint-db.
# deny still errors on any unsafe in the library.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
mem_forget = "deny"
