# cargo-deny config. the point of interest is [advisories] (RUSTSEC) and
# [sources] (only crates.io), since fnprint pulls three bundled C libraries.
# the license allow-list may need a tweak on the first CI run, cargo-deny prints
# exactly which license it saw and where.

[advisories]
version = 2
yanked = "deny"
# only add a RUSTSEC id here with a written reason and a tracking issue
ignore = []

[bans]
# transitive dups we don't control (hashbrown, syn, shlex) -> warn not deny
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# note: unicorn-engine links GPL-2.0 Unicorn, so GPL is in here on purpose.
# fnprint's own crates are MIT; shipping alongside GPL Unicorn is a known
# redistribution consideration, tracked separately from this security work.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "GPL-2.0",
    "LGPL-2.1",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
