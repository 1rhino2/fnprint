[workspace]
resolver = "2"
members = [
    "crates/fnprint-loader",
    "crates/fnprint-emu",
    "crates/fnprint-trace",
    "crates/fnprint-sig",
    "crates/fnprint-db",
    "crates/fnprint-core",
    "crates/fnprint-sandbox",
    "cli",
]

[workspace.package]
version = "0.2.5"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/1rhino2/fnprint"

[workspace.dependencies]
anyhow = "1"
goblin = "0.8"
gimli = "0.31"
capstone = "0.14"
# x86-only: fnprint only emulates x86-64, so ask unicorn to build just the x86 TCG
# backend and skip the other 9 arches, shrinking the native attack surface.
# caveat: unicorn-engine-sys links a system libunicorn via pkg-config when one is
# present (e.g. libunicorn-dev), and that prebuilt lib is all-arch, so the trim
# only actually takes effect on a from-source build with no system unicorn in the
# build env. harmless when it doesn't apply; the seccomp jail is the real
# containment regardless.
unicorn-engine = { version = "2.1", default-features = false, features = ["arch_x86"] }
# serialize gives sqlite3_deserialize, used to parse a corpus .db entirely in
# memory inside the jailed worker (no file open), see fnprint-db::Db::open_image.
rusqlite = { version = "0.31", features = ["bundled", "serialize"] }
rayon = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# default features pull heapless-cas -> heapless 0.7 -> atomic-polyfill, which is
# unmaintained (RUSTSEC-2023-0089). we only need alloc + std, so drop defaults.
postcard = { version = "1", default-features = false, features = ["use-std"] }

# hardened release build: no unwinding into a bad state, overflow aborts instead
# of wrapping into a bad index, and strip symbols.
[profile.release]
panic = "abort"
overflow-checks = true
lto = "thin"
codegen-units = 1
strip = true

# the workspace is unsafe-forbid everywhere except fnprint-db, which carries one
# audited unsafe FFI shim (sqlite3_malloc for deserialize; it has its own
# [lints] setting unsafe_code = "deny" plus a single scoped #[allow]). the only
# native memory lives inside the unicorn/capstone/sqlite C libs, not our code.
# also ban the panic-macro family so no parse path can grow a panic (none today).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
mem_forget = "deny"
