[workspace]
resolver = "2"
members = [
    "crates/fnprint-loader",
    "crates/fnprint-emu",
    "crates/fnprint-trace",
    "crates/fnprint-sig",
    "crates/fnprint-db",
    "crates/fnprint-core",
    "crates/fnprint-sandbox",
    "cli",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/1rhino2/fnprint"

[workspace.dependencies]
anyhow = "1"
goblin = "0.8"
gimli = "0.31"
capstone = "0.14"
# no-JIT (TCI) unicorn fork: builds unicorn from source with the tiny code
# interpreter (no host codegen -> no executable page needed) and x86-only TCG.
# this is what lets the seccomp jail forbid PROT_EXEC outright (see SECURITY.md).
# the fork always builds from source, so unlike the stock crate it never links an
# ambient system libunicorn, and both the exec-free guarantee and the arch trim
# actually apply. published as unicorn-engine-tci + unicorn-engine-sys-tci
# (GPL-2.0) from github.com/1rhino2/unicorn-tci, pinned to 2.1.5.
unicorn-engine = { package = "unicorn-engine-tci", version = "=2.1.5", default-features = false, features = ["arch_x86"] }
# serialize gives sqlite3_deserialize, used to parse a corpus .db entirely in
# memory inside the jailed worker (no file open), see fnprint-db::Db::open_image.
rusqlite = { version = "0.31", features = ["bundled", "serialize"] }
rayon = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# output-only: we serialize result structs to json, never parse untrusted json.
serde_json = "1"
# default features pull heapless-cas -> heapless 0.7 -> atomic-polyfill, which is
# unmaintained (RUSTSEC-2023-0089). we only need alloc + std, so drop defaults.
postcard = { version = "1", default-features = false, features = ["use-std"] }

# hardened release build: no unwinding into a bad state, overflow aborts instead
# of wrapping into a bad index, and strip symbols.
[profile.release]
panic = "abort"
overflow-checks = true
lto = "thin"
codegen-units = 1
strip = true

# the workspace is unsafe-forbid everywhere except two crates that set their own
# [lints] to unsafe_code = "deny" plus a single scoped #[allow]: fnprint-db (one
# audited sqlite3_malloc FFI shim for deserialize) and fnprint-sandbox (only its
# jailbreak_probe test binary, which needs raw mmap/mprotect to prove the
# PROT_EXEC deny; the sandbox library itself is unsafe-free). the only native
# memory lives inside the unicorn/capstone/sqlite C libs, not our code.
# also ban the panic-macro family so no parse path can grow a panic (none today).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
mem_forget = "deny"
