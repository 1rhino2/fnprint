[package]
name = "fnprint"
version = "0.3.2"
edition.workspace = true
license.workspace = true
description = "Match functions in binaries by what they do, not what their bytes look like"
repository.workspace = true
keywords = ["reverse-engineering", "binary-analysis", "fingerprint", "disassembly", "security"]
categories = ["command-line-utilities", "development-tools"]
readme = "../README.md"

[[bin]]
name = "fnprint"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
fnprint-core = { path = "../crates/fnprint-core", version = "0.3.2" }
fnprint-db = { path = "../crates/fnprint-db", version = "0.3.2" }
fnprint-loader = { path = "../crates/fnprint-loader", version = "0.3.2" }
fnprint-emu = { path = "../crates/fnprint-emu", version = "0.3.2" }
fnprint-sandbox = { path = "../crates/fnprint-sandbox", version = "0.3.2" }
serde = { workspace = true }
postcard = { workspace = true }
# safe syscall wrapper (already in the tree transitively) for the process-group
# kill in the worker watchdog. keeps the cli unsafe-forbid, no raw libc::kill.
rustix = { version = "0.38", features = ["process"] }

[lints]
workspace = true
