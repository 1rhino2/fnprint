[package]
name = "fnprint"
version = "0.3.1"
edition.workspace = true
license.workspace = true
description = "Match functions in binaries by what they do, not what their bytes look like"
repository.workspace = true
keywords = ["reverse-engineering", "binary-analysis", "fingerprint", "disassembly", "security"]
categories = ["command-line-utilities", "development-tools"]
readme = "../README.md"

[[bin]]
name = "fnprint"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
fnprint-core = { path = "../crates/fnprint-core", version = "0.3.1" }
fnprint-db = { path = "../crates/fnprint-db", version = "0.3.1" }
fnprint-loader = { path = "../crates/fnprint-loader", version = "0.3.1" }
fnprint-emu = { path = "../crates/fnprint-emu", version = "0.3.1" }
fnprint-sandbox = { path = "../crates/fnprint-sandbox", version = "0.3.1" }
serde = { workspace = true }
postcard = { workspace = true }

[lints]
workspace = true
